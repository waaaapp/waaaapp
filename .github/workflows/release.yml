name: Build and release
on:
  push:
    branches: [prod]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - id: version
        run: echo "value=2.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set release version
        run: npm version '${{ needs.prepare.outputs.version }}' --no-git-tag-version
      - name: Configure Apple signing and notarization
        if: matrix.target == 'mac' && github.event_name != 'pull_request'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for credential in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!credential}" ]]; then
              echo "::error::Missing required signing credential: $credential"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          npm pkg set signedMac=true --json
      - name: Build packages and update manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.target == 'mac' && github.event_name != 'pull_request' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ matrix.target == 'mac' && github.event_name != 'pull_request' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.target == 'mac' && github.event_name != 'pull_request' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          if [[ -z "${CSC_LINK:-}" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --${{ matrix.target }} --publish never
      - name: Verify notarized Mac application
        if: matrix.target == 'mac' && github.event_name != 'pull_request'
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-universal/waaaapp.app
          spctl --assess --type execute --verbose=2 release/mac-universal/waaaapp.app
          xcrun stapler validate release/mac-universal/waaaapp.app
      - name: Remove temporary Apple API key
        if: always() && matrix.target == 'mac'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
  publish:
    if: github.ref == 'refs/heads/prod' && github.event_name != 'pull_request'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Validate all artifacts, create checksums and Homebrew cask
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release.mjs
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --draft --target '${{ github.sha }}' --title "waaaapp $VERSION" --notes-file RELEASE_NOTES.md
          fi
          if [[ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh release upload "v$VERSION" release/* --clobber
            gh release edit "v$VERSION" --draft=false --latest
          fi
      - name: Update Homebrew tap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/waaaapp.rb
          git commit -m 'Update Homebrew cask to ${{ needs.prepare.outputs.version }}'
          git pull --rebase origin prod
          git push origin HEAD:prod
