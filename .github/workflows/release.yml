name: Build and Release

on:
  push:
    branches:
      - prod

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: pkg
        run: echo "version=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

  create_release:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
      release_tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        id: release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.prepare.outputs.version }}-${{ github.run_number }}
          release_name: waaaapp v${{ needs.prepare.outputs.version }} (build ${{ github.run_number }})
          draft: false
          prerelease: false

  build:
    needs: [prepare, create_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: "win portable"
            pattern: "release/*Portable.exe"
          - os: macos-latest
            target: "mac dmg"
            pattern: "release/*.dmg"
          - os: ubuntu-latest
            target: "linux AppImage"
            pattern: "release/*.AppImage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --${{ matrix.target }}
      - name: Find artifact
        id: find_artifact
        run: |
          set -e
          file=$(ls ${{ matrix.pattern }} | head -n 1)
          echo "file=$file" >> $GITHUB_OUTPUT
          echo "name=$(basename "$file")" >> $GITHUB_OUTPUT
      - name: Upload to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_artifact.outputs.file }}
          asset_name: ${{ steps.find_artifact.outputs.name }}
          asset_content_type: application/octet-stream
